name: Validate catalog

on:
  pull_request:
    branches: [main]
    paths:
      - catalog.json
      - plugins/**
      - .github/scripts/validate_catalog.py

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog.json
        run: python .github/scripts/validate_catalog.py
